version: "3.8"
services:
  postgres:
    build:
      context: ./postgres-dev
    container_name: postgres
    restart: always
    ports:
      - 5432:5432
    volumes:
      - ./db_data/:/var/lib/postgresql/data
    environment:
      POSTGRESQL_USERNAME: $POSTGRES_USERNAME
      POSTGRESQL_PASSWORD: $POSTGRES_PASSWORD
      POSTGRESQL_DATABASE: $POSTGRES_DATABASE
      POSTGRESQL_DATABASE_LIST: $POSTGRES_DATABASE_LIST
    networks:
      - shared_network

  redis:
    image: redis/redis-stack-server
    container_name: redis
    restart: always
    ports:
      - 6379:6379
    # AOF persistence: task_deadlines and the archive/webhook queues live in
    # Redis, so they must survive a restart (phase 9). The binary refuses to
    # start against a Redis that reports appendonly no (SAGAWISE_REDIS_AOF).
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
    volumes:
      - redis_data:/data
    networks:
      - shared_network

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - $MACHINE_ADMINER_PORT:$ADMINER_PORT
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  redisinsight:
    image: redis/redisinsight
    container_name: redosinsight
    restart: always
    ports:
      - $REDIS_INSIGHT_MACHINE_PORT:$REDIS_INSIGHT_PORT
    depends_on:
      - redis

  sagawise:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sagawise
    restart: always
    ports:
      - 5000:5000
      # Prometheus metrics (no API key; do not expose beyond the host).
      - 9464:9464
    environment:
      REDIS_CONNECTION_STRING: $REDIS_CONNECTION_STRING
      REDIS_HOST: $REDIS_HOST
      REDIS_PORT: $REDIS_PORT
      POSTGRES_HOST: $POSTGRES_HOST
      POSTGRES_PORT: $POSTGRES_PORT
      POSTGRES_USERNAME: $POSTGRES_USERNAME
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DATABASE: $POSTGRES_DATABASE
      SAGAWISE_API_KEYS: $SAGAWISE_API_KEYS
      SAGAWISE_WEBHOOK_SECRET: $SAGAWISE_WEBHOOK_SECRET
      SAGAWISE_CORS_ORIGINS: $SAGAWISE_CORS_ORIGINS
      SAGAWISE_MAX_BODY_BYTES: $SAGAWISE_MAX_BODY_BYTES
      SAGAWISE_LOG_FORMAT: $SAGAWISE_LOG_FORMAT
      SAGAWISE_LOG_LEVEL: $SAGAWISE_LOG_LEVEL
      SAGAWISE_METRICS_ADDR: $SAGAWISE_METRICS_ADDR
      SAGAWISE_REDIS_AOF: $SAGAWISE_REDIS_AOF
    healthcheck:
      # /ready is 503 only when Redis is down or a loop is stalled; Postgres
      # down is "degraded" but still 200 (docs/operations.md).
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:5000/live || exit 1; curl -f http://localhost:5000/ready || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shared_network

    depends_on:
      - redis
      - postgres

volumes:
  redis_data:

networks:
  shared_network:
    external: true