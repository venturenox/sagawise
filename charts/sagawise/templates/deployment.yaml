apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sagawise.fullname" . }}
  namespace: {{ include "relname" . }}
  labels:
    {{- include "sagawise.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sagawise.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sagawise.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sagawise.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ include "sagawise.application.port" . }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
          - name: REDIS_CONNECTION_STRING
            value: {{ include "snippet.redis.connection.string" . }}
          - name: REDIS_HOST
            value: {{ include "snippet.redis.host" . }}
          - name: REDIS_PORT
            value: {{ include "snippet.redis.port" . | quote }}
          {{- if not .Values.redis.enabled }}
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ include "sagawise.secretName" . }}
                key: redis-password
          {{- end }}
          - name: POSTGRES_HOST
            value: {{ include "snippet.postgresql.host" . }}
          - name: POSTGRES_PORT
            value: {{ include "snippet.postgresql.port" . | quote }}
          - name: POSTGRES_USERNAME
            value: {{ include "snippet.postgresql.username" . }}  
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                {{- if .Values.postgresql.enabled }}
                name: {{ include "sagawise.postgresql.fullname" . }}
                key: postgres-password
                {{- else }}
                name: {{ include "sagawise.secretName" . }}
                key: postgres-password
                {{- end }}
          - name: POSTGRES_DATABASE
            value: {{ include "snippet.postgresql.database" . }}
          - name: SERVER_ENV
            value: development
          # Phase 8 security settings (docs/security.md).
          - name: SAGAWISE_AUTH
            value: {{ .Values.auth.mode | quote }}
          {{- if ne .Values.auth.mode "off" }}
          - name: SAGAWISE_API_KEYS
            valueFrom:
              secretKeyRef:
                name: {{ include "sagawise.secretName" . }}
                key: api-keys
          {{- end }}
          - name: SAGAWISE_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ include "sagawise.secretName" . }}
                key: webhook-secret
                optional: true
          - name: SAGAWISE_CORS_ORIGINS
            value: {{ join "," .Values.cors.origins | quote }}
          - name: SAGAWISE_MAX_BODY_BYTES
            value: {{ .Values.maxBodyBytes | quote }}
          # Phase 9 operations (docs/operations.md).
          - name: SAGAWISE_LOG_FORMAT
            value: {{ .Values.logging.format | quote }}
          - name: SAGAWISE_LOG_LEVEL
            value: {{ .Values.logging.level | quote }}
          - name: SAGAWISE_METRICS_ADDR
            value: {{ if .Values.metrics.enabled }}{{ printf ":%v" .Values.metrics.port | quote }}{{ else }}"off"{{ end }}
          - name: SAGAWISE_REDIS_AOF
            value: {{ .Values.redisAOF | quote }}
          # /live: the reaper and queue workers are ticking (no store
          # access, so a store outage never restarts the pod). /ready: that
          # plus Redis reachable; Postgres down is "degraded" but still 200.
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
