{{- /*
Sagawise's own credentials (phase 8): the API keys clients present, the
HMAC secret failure webhooks are signed with, and the passwords of external
stores. Rendered only when no existingSecret is named; with existingSecret
the operator owns the Secret and it must carry the same keys.
*/ -}}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sagawise.secretName" . }}
  namespace: {{ include "relname" . }}
  labels:
    {{- include "sagawise.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-keys: {{ required "auth.apiKeys must list at least one API key (or set auth.mode=off for a development-only open API)" (join "," .Values.auth.apiKeys) | quote }}
  webhook-secret: {{ .Values.webhook.secret | quote }}
  {{- if not .Values.redis.enabled }}
  redis-password: {{ .Values.externalRedis.password | default "" | quote }}
  {{- end }}
  {{- if not .Values.postgresql.enabled }}
  postgres-password: {{ .Values.externalPostgresql.password | default "" | quote }}
  {{- end }}
{{- end }}
