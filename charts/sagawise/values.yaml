# Default values for sagawise.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  # The name of the repository for the docker image used in sagawise deployment.
  repository: venturenox/sagawise
  # The pull policy for docker image used in sagawise deployment.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# A list of references to Kubernetes Secret objects that contain credentials
# for pulling images from private registries.
imagePullSecrets: []

# Allows to override the name of a resource defined in the chart without affecting other resources.
nameOverride: ""

# Allows you to completely override the full name of the resources created by the chart.
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Allows you to add custom annotations to the Pod
podAnnotations: {}

# Defines security settings at the Pod level, which apply to all containers within the Pod.
# The image runs as uid 65532 and writes nothing to disk, so the restricted
# Pod Security Standard is the default here (phase 8).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Configures security-related settings at the container level
# impacting how a container operates and interacts with the underlying node’s resources.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# --- Sagawise security (phase 8, docs/threat-model.md) ---

auth:
  # "api-key" (default): every request except the probes must carry
  # `Authorization: Bearer <key>` with one of auth.apiKeys. "off": an open
  # API, for development clusters only; the server logs a warning.
  mode: api-key
  # The accepted keys. Rotate by listing the old and the new key, rolling
  # the clients, then removing the old one. Rendered into a Secret unless
  # existingSecret is set.
  apiKeys: []
  # Name of a Secret the operator manages instead of the chart's. It must
  # hold the keys `api-keys` (comma-separated), `webhook-secret`, and, for
  # external stores, `redis-password` / `postgres-password`.
  existingSecret: ""

webhook:
  # HMAC-SHA256 secret failure webhooks are signed with
  # (X-Sagawise-Signature). Empty means unsigned deliveries; receivers
  # should verify (see the SDKs' verify_signature).
  secret: ""

cors:
  # Browser origins allowed to call the API, exact (scheme://host[:port]).
  # Empty means no cross-origin browser access; "*" is refused at startup.
  origins: []

# Largest accepted request body (publish payload). K/M suffixes allowed.
maxBodyBytes: 1M

networkPolicy:
  # Default-deny ingress to the Sagawise pods; only `ingress` may reach the
  # API port. Needs a CNI that enforces NetworkPolicy.
  enabled: false
  # Peers allowed in, as NetworkPolicy `from` entries. Example: the
  # ingress-nginx namespace and the namespaces of the reporting services.
  ingress: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx
  # Egress rules; empty leaves egress open (webhooks go where services.json
  # points, and Redis/Postgres may be external).
  egress: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # cert-manager.io/acme-challenge-type: dns01
    # cert-manager.io/acme-dns01-provider: cloudflare
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # nginx.ingress.kubernetes.io/enable-cors: "false"
    # nginx.ingress.kubernetes.io/proxy-body-size: 50m
  hosts:
    - host: api-sagawise.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: sagawise.tls
      hosts:
        - api-sagawise.example.com

# PostgreSQL Configuration
postgresql:
  # Enable or disable the deployment of an internal PostgreSQL database.
  enabled: true
  auth:
    # (Optional) Specify the password for the PostgreSQL superuser. Required if 'enabled' is true.
    postgresPassword: ""
    # (Optional) Specify the name of the database to create within PostgreSQL.
    database: sagawise

  ## @param passwordUpdateJob.enabled Enable password update job
  ##
  passwordUpdateJob:
    enabled: false

# External PostgreSQL Configuration
externalPostgresql:
  # Hostname or IP address of an external PostgreSQL database.
  host:
  # Username to access the external PostgreSQL database.
  username: postgres
  # Password for the specified username to access the external PostgreSQL database.
  password: ""
  # Name of the database in the external PostgreSQL instance.
  database: sagawise

# Redis Configuration
redis:
  # Enable or disable the deployment of an internal Redis instance.
  enabled: true
  auth:
    # Enable or disable authentication for the internal Redis instance.
    enabled: false
  replica:
    # Number of Redis replicas to deploy if 'enabled' is true. Only applies when Redis is deployed internally.
    replicaCount: 0

# External Redis Configuration
externalRedis:
  # Hostname or IP address of an external Redis instance.
  host:
  # Password for accessing the external Redis instance. Required if authentication is enabled.
  password:

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

replicaCount: 1

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
