# Prometheus alerting rules for Sagawise (roadmap phase 9).
#
# The same rules are rendered by the Helm chart when
# metrics.prometheusRule.enabled is set (charts/sagawise/templates/prometheusrule.yaml);
# keep the two in step. Every metric named here is checked against what the
# binary exports by TestOps_AlertRulesReferenceExportedMetrics.
# What to do when one fires: docs/operations.md, section named after the alert.
groups:
  - name: sagawise
    rules:
      - alert: SagawiseDown
        expr: up{job="sagawise"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sagawise is not being scraped"
          description: "No metrics from {{ $labels.instance }} for 2 minutes. Reports fail and timeouts are not enforced."

      - alert: SagawiseReaperStalled
        # The reaper ticks every second; 60 s without a completed tick means
        # the loop is stuck or the process is wedged. Deadlines are not
        # being enforced while this fires.
        expr: time() - sagawise_reaper_last_tick_seconds > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Reaper has not ticked for over a minute"
          description: "{{ $labels.instance }}: last reaper tick {{ $value | humanizeDuration }} ago. Timed-out tasks are not being failed."

      - alert: SagawiseReaperBehind
        # The oldest overdue deadline is older than 10 s: the reaper is
        # running but cannot keep up, or its ticks are erroring (see
        # sagawise_reaper_ticks_total{result="error"}).
        expr: sagawise_reaper_overdue_seconds > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Reaper is behind on deadlines"
          description: "{{ $labels.instance }}: a deadline has been overdue for {{ $value | humanizeDuration }}. Timeouts fire late."

      - alert: SagawiseReaperErrors
        expr: increase(sagawise_reaper_ticks_total{result="error"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Reaper ticks are failing"
          description: "{{ $labels.instance }}: reaper ticks have errored for 5 minutes (usually Redis). Nothing is lost; deadlines wait for the next successful tick."

      - alert: SagawiseArchiveFailing
        # Archive jobs failing for 10 minutes: Postgres is down or refusing
        # inserts. Terminal instances queue in Redis (archive_pending) and
        # are written when it returns; nothing is lost while Redis holds.
        expr: increase(sagawise_queue_jobs_total{queue="archive",result="failed"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Archives to Postgres are failing"
          description: "{{ $labels.instance }}: archive jobs have failed for 10 minutes; {{ with printf `sagawise_queue_pending{queue=\"archive\",instance=\"%s\"}` $labels.instance | query }}{{ . | first | value }}{{ end }} instance(s) waiting."

      - alert: SagawiseArchiveBacklog
        expr: sagawise_queue_pending{queue="archive"} > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Archive backlog is growing"
          description: "{{ $labels.instance }}: {{ $value }} terminal instances are waiting to be archived."

      - alert: SagawiseWebhookGaveUp
        # A failure webhook was dropped after all retries (about 15 min):
        # the publishing service never learned that its task failed and has
        # not compensated. The instance id is in the log line "giving up on job".
        expr: increase(sagawise_queue_jobs_total{queue="webhook",result="gave_up"}[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "A failure webhook was dropped after all retries"
          description: "{{ $labels.instance }}: {{ $value }} webhook(s) given up in the last hour. Find the instance ids in the log (msg=\"giving up on job\") and compensate by hand."

      - alert: SagawiseStoreDown
        expr: sagawise_store_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.store }} is unreachable from Sagawise"
          description: "{{ $labels.instance }} cannot reach {{ $labels.store }}. Redis down: the API answers 500 and /ready is 503. Postgres down: the API serves, archives queue up."

      - alert: SagawiseRedisPersistenceOff
        # appendonly no: task_deadlines and the queues live only in memory
        # and a Redis restart loses every armed timeout. The binary refuses
        # to start like this unless SAGAWISE_REDIS_AOF=warn.
        expr: sagawise_redis_appendonly == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis AOF persistence is off"
          description: "{{ $labels.instance }}: Redis reports appendonly no. Armed deadlines will not survive a Redis restart."
